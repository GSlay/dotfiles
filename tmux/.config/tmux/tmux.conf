# shell
set -g default-command $SHELL
set -g default-shell $SHELL

# start with window 1 (instead of 0)
set -g base-index 1

# renumber windows after closing
set -g renumber-windows on

# start with pane 1
set -g pane-base-index 1

# remove esc delay
set -sg escape-time 0

# history
set -g history-limit 10000

# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

# true colors (Tối ưu cho Kitty + Catppuccin)
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-kitty:RGB'

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# pleb/ipad mode
set -g mouse on

# focusing
set-option -g focus-events on

# ==========================================
# STYLING (Catppuccin Latte Colors Integration)
# ==========================================

# Sắp xếp nền Pane đồng bộ với Latte (Base: #eff1f5, Mantle: #e6e9ef)
set -g window-active-style 'bg=#eff1f5'
set -g window-style 'bg=#e6e9ef'

# Viền pane thanh thoát, không bị vệt đen chướng mắt
set -g pane-border-lines "heavy"
set -g pane-border-style "bg=default,fg=#ccd0da"
set -g pane-active-border-style "bg=default,fg=#1e66f5"

# Giữ status nằm ở bottom giống config cũ
set-option -g status-position bottom

# Loud or quiet?
set-option -g visual-activity on
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# ==========================================
# KEY BINDINGS
# ==========================================

# change prefix to backtick
unbind C-b
set-option -g prefix `
bind ` send-prefix

# vim style copy paste mode
unbind [
bind space copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
# bind-key -T copy-mode-vi 'Y' send -X copy-pipe-and-cancel "tmux loadb -" \; send-keys enter
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "yank" \; send-keys enter

# MacOS Clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# splitting
unbind %
bind h split-window -v
unbind '"'
bind v split-window -h

# zoom split
unbind z
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind z if-shell "$is_vim" "send-keys ,z" "resize-pane -Z"
bind Z resize-pane -Z

# vim style commands
bind : command-prompt

# source config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "█▓░ reloaded"

# other random key-binding changes
bind x kill-pane
bind t set status
bind a set-window-option synchronize-panes \; display-message "█▓░ synchronize"

# Move window to other window as a pane!
bind-key m choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"
bind-key M choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"

# ==========================================
# PLUGINS & CONFIGURATIONS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# --- THEME: CATPPUCCIN STATUS BAR ---
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'latte' # Ép về bản nền sáng Latte

# Config giao diện các tab (Windows) kiểu bo tròn (Pills) sang xịn mịn
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Config các module hiển thị phía bên phải status bar
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# --- CÁC PLUGIN BỔ TRỢ KHÁC ---

# sticky fingers (thumbs)
set -g @plugin 'fcsonline/tmux-thumbs'
unbind f
set -g @thumbs-key f
set -g @thumbs-contrast 1
set -g @thumbs-bg-color '#ea76cb'      # Pink Latte
set -g @thumbs-fg-color '#eff1f5'      
set -g @thumbs-hint-bg-color '#40a02b' # Green Latte
set -g @thumbs-hint-fg-color '#eff1f5'
set -g @thumbs-select-bg-color '#1e66f5' # Blue Latte
set -g @thumbs-select-fg-color '#eff1f5'
set -g @thumbs-command 'printf "{}" | yank'

# navigate and resize nvim/tmux splits
set -g @plugin 'aserowy/tmux.nvim'
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'C-Left'
set -g @tmux-nvim-resize-keybinding-down 'C-Down'
set -g @tmux-nvim-resize-keybinding-up 'C-Up'
set -g @tmux-nvim-resize-keybinding-right 'C-Right'

# enable OSC 52 clipboard
set -s set-clipboard on
set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7,xterm*:XT:Ms=\\E]52;c;%p2%s\\7"
unbind p
bind p paste-buffer -p

# clipboard menu
bind escape display-popup -b "heavy" -S 'bg=#e6e9ef,fg=#1e66f5' -w 70% -h 70% -E "CM_OUTPUT_CLIP=1 clipmenu | yank"

# emoji menu
bind e display-popup -b "heavy" -S 'bg=#e6e9ef,fg=#1e66f5' -w 70% -h 70% -E "emoji"

unbind-key C-BS

# clipboard plugin
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.config/tmux/plugins/tpm/tpm'
